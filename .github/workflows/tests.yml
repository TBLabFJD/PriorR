# Tests of PriorR on Linux, Windows and macOS (synthetic data only), on every push and pull request
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install the R packages of PriorR (the same list as launch.R) and testthat
        shell: Rscript {0}
        run: |
          src <- readLines("launch.R")
          start <- grep("^packages <- c\\(", src)
          end <- start + which(grepl("\\)\\s*$", src[start:length(src)]))[1] - 1
          eval(parse(text = src[start:end]))
          install.packages(c(packages, "testthat", "withr"))
          missing <- packages[!vapply(packages, requireNamespace, logical(1), quietly = TRUE)]
          if (length(missing)) stop("Not installed: ", paste(missing, collapse = ", "))

      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          if ! Rscript tests/run_tests.R 2>&1 | tee tests.log; then
            # the failures as one annotation of the run (visible without signing in)
            msg=$(grep -A8 -E "(Failure|Error|FAILURE|ERROR)" tests.log | head -120 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Failed tests on ${{ matrix.os }}::${msg}"
            exit 1
          fi

      - name: The app starts (the UI is built without errors)
        shell: Rscript {0}
        working-directory: app
        run: |
          Sys.setenv(PRIORR_LOCAL = "1", PRIORR_SHARED_DIR = file.path(tempdir(), "shared"),
                     PRIORR_USER_CONFIG = file.path(tempdir(), "priorr.cfg"), PRIORR_LOGIN_DIR = file.path(tempdir(), "login"))
          app <- shiny::shinyAppDir(".")
          html <- as.character(app$httpHandler(list(PATH_INFO = "/", REQUEST_METHOD = "GET",
                                                    rook.input = list(read = function(...) raw(0))))$content)
          stopifnot(grepl("PriorR v4", html))
          cat("PriorR UI built\n")
