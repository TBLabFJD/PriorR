# Installers of PriorR: PriorR-<version>-setup.exe (Windows, Inno Setup) and PriorR-<version>.pkg (macOS).
# They are built when the installers change, by hand (Actions > installers > Run workflow) and for a
# release tag (v4.0...), whose GitHub release gets both files. The installers are not signed.
name: installers

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["installers/**", "launch.R", "PriorR.bat", "PriorR.command", ".github/workflows/installers.yml"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build the installer
        run: iscc installers\windows\priorr.iss
      - uses: actions/upload-artifact@v4
        with:
          name: PriorR-windows-installer
          path: installers/windows/Output/*.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installers/windows/Output/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the installer
        run: bash installers/macos/build_pkg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PriorR-macos-installer
          path: installers/macos/Output/*.pkg
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installers/macos/Output/*.pkg
